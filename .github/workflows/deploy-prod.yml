# Production is a separate, manual action after a reviewed dev -> main merge.
# In Actions, run deploy-prod on main when the tested release is approved.
#
# The manual run passes --promote. deploy.sh owns the
# art gate: if the deployed range touches art it dies asking for
# --art-approved, exactly as it does when run by hand — nothing reaches the
# public by momentum. For those ranges, run workflow_dispatch with the
# sign-off text (who approved, when); it is passed through verbatim and lands
# in the deploy report.
#
# Fork safety: manual dispatch only, always checking out protected main.
name: deploy-prod

on:
  workflow_dispatch:
    inputs:
      art_approved:
        description: "Art sign-off, e.g. 'Erna, 2026-09-01' — required only when the range touches art"
        required: false
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, homeserver]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: fetch PNG masters (LFS)
        # Same reason as deploy-dev: the workspace fast-fail reads sprites.
        run: git lfs pull --include="*.PNG,*.png"
      - name: deploy to tt.spliffdonk.com
        env:
          ART_APPROVED: ${{ inputs.art_approved }}
        run: |
          if [ -n "$ART_APPROVED" ]; then
            tools/deploy.sh --env prod --promote --art-approved "$ART_APPROVED"
          else
            tools/deploy.sh --env prod --promote
          fi
