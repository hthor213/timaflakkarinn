<!DOCTYPE html>
<html lang="is">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tímaflakkarinn</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    /* Debug deployment (tt-dev.*) reserves room for the 280px side panel and
       180px log strip. Play deployment gets the whole viewport. main.ts stamps
       data-mode on <html>. */
    /* 280px for the side panel; the bottom strip is only 24px while the log is
       collapsed, which is the default. Expanding it takes 180px and the canvas
       gives that space back. */
    html[data-mode="debug"] body {
      width: calc(100vw - 280px);
      height: calc(100vh - 24px);
    }
    html[data-mode="debug"][data-dbg-log="open"] body {
      height: calc(100vh - 180px);
    }
    /* The canvas is a fixed 800x600, so on a laptop the debug layout can clip
       it. Scale it down to fit rather than cropping the top off the scene. */
    html[data-mode="debug"] #game-container {
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 4 / 3;
      width: min(800px, 100%, calc(100% * 4 / 3));
      height: auto;
    }
    html[data-mode="debug"] #game-canvas {
      width: 100%;
      height: 100%;
    }
    #game-container {
      position: relative;
      width: 800px;
      height: 600px;
    }
    /* Play: scale to fit the viewport, preserving the 4:3 frame. The canvas
       backing store stays 800x600, so every game coordinate is unchanged, and
       World.handleMouseMove already maps pointer position through
       getBoundingClientRect() — so scaling is safe for input. */
    html[data-mode="play"] #game-container {
      width: min(100vw, calc(100vh * 4 / 3));
      height: min(100vh, calc(100vw * 3 / 4));
    }
    html[data-mode="play"] #game-canvas {
      width: 100%;
      height: 100%;
    }
    #game-canvas {
      display: block;
      image-rendering: pixelated;
      cursor: none;
    }

    /* ---------------------------------------------------------------------
       Touch layout. Portrait only, and deliberately "usable" rather than
       optimised: the 4:3 frame keeps the whole width, and everything portrait
       has left over goes to the verb bar.

       These rules come last and are written to outrank the debug rules above,
       because the phone this is played on points at tt-dev — where the debug
       layout reserves 280px for a side panel that is wider than a third of the
       screen and a fixed panel that sits on top of the bar.
       --------------------------------------------------------------------- */
    html[data-input="touch"] body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      width: 100vw;
      height: 100dvh;   /* dvh, not vh: vh includes the mobile URL bar, so the
                           bar would sit under it until the browser settled */
    }
    html[data-input="touch"] #game-container,
    html[data-mode="debug"][data-input="touch"] #game-container {
      width: 100vw;
      height: calc(100vw * 3 / 4);
      max-width: 100vw;
      max-height: calc(100vw * 3 / 4);
      flex: 0 0 auto;
      aspect-ratio: auto;
    }
    html[data-input="touch"] #game-canvas {
      width: 100%;
      height: 100%;
    }
    /* Unusable at this size and it overlaps the bar. ?touch=0 brings it back. */
    html[data-input="touch"] #debug-panel,
    html[data-input="touch"] #dbg-logbar {
      display: none !important;
    }

    #verb-bar { display: none; }
    html[data-input="touch"] #verb-bar {
      display: flex;
      width: 100vw;
      flex: 1 1 auto;
      min-height: 88px;
      background: #14100c;
      border-top: 1px solid #3a3025;
    }
    html[data-input="touch"] #verb-bar.idle { opacity: 0.45; }

    #verb-bar .verb {
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: 0;
      padding: 8px 2px;
      border: 0;
      border-right: 1px solid #2a231b;
      background: transparent;
      color: #c8a040;
      font-family: serif;
      font-size: clamp(13px, 3.6vw, 18px);
      line-height: 1;
      /* The tap target is the whole cell, which on any phone clears 44px. */
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
    }
    #verb-bar .verb:last-child { border-right: 0; }
    #verb-bar .verb svg {
      width: clamp(26px, 7vw, 38px);
      height: clamp(26px, 7vw, 38px);
    }
    #verb-bar .verb.active {
      background: #c8a040;
      color: #14100c;
    }
    #verb-bar .verb:disabled {
      color: #5a4c38;
      cursor: default;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ccc;
      font-family: serif;
      font-size: 24px;
      text-align: center;
    }
    #loading .bar {
      width: 300px;
      height: 8px;
      background: #333;
      margin: 16px auto;
      border-radius: 4px;
    }
    #loading .bar-fill {
      height: 100%;
      background: #c8a040;
      border-radius: 4px;
      width: 0%;
      transition: width 0.3s;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas" width="800" height="600"></canvas>
    <div id="loading">
      <div>Tímaflakkarinn</div>
      <div class="bar"><div class="bar-fill" id="loading-bar"></div></div>
      <div id="loading-text" style="font-size: 14px; margin-top: 8px;">Hleð inn...</div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
