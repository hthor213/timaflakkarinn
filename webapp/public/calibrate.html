<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8">
<title>Tímaflakkarinn — perspective calibration</title>
<!--
  Per-background perspective calibration, and a look at the four layers.

  WHAT IT PRODUCES. The engine's entire notion of depth on a terrain is four
  numbers:

      <SimplePseudo3DTerrain defaultscaling="D" scanline1="A"
                             scanline2="B" scaling2="S"/>

  The character is D times size at screen line A and S times at line B, linear
  in between and beyond (Terrain.setScalingParameters / getScaling). Nothing
  else is consumed. So calibrating a background means: put him on two lines,
  size him until each looks right, copy the four numbers into the GML.

  47 of the 70 scene terrains have no ramp at all and scale by a constant, which
  is why characters do not shrink with depth. Two of the calibrated ones are
  suspect -- t_HjaVolvul ramps 1.031x where perspective wants about 1.63x.

  THE VANISHING POINT. The engine's scale is linear in y -- and so is a pinhole
  camera over a flat floor, with scale hitting zero exactly at the horizon. The
  lerp's zero IS the vanishing line: the four numbers have always encoded a
  perspective camera, whether 1998 knew it or not. So the horizon is drawn as a
  derived, draggable line; dragging it keeps the front anchor (scanline1,
  defaultscaling) and rewrites scaling2 = d*(b-yh)/(a-yh). One size judgement at
  the front plus one horizon replaces guessing both scalings. The grid rails
  converge on the VP, and the depth lines sit at equal ground steps -- for a
  flat floor 1/(y-yh) advances by a constant per step, no focal length needed.
  "Show him" drops the real player sprite on the plane, draggable, scaling
  continuously by getScaling's own formula: the does-that-look-right check.

  THE PINS. The resize is the interaction, the plane is the output. Park him
  beside any reference the art offers, scroll him to the right size, and
  double-click to pin that judgement -- a size for a position. Two pins ARE
  the engine's plane and are written into the four numbers exactly. Three or
  more are least-squared, and additionally fit the full plane k = px + qy + r,
  whose zero line is a vanishing line that may tilt: lateral perspective the
  engine cannot express. That tilt and the fit residual are recorded for the
  remaster, and tell you whether the painted floor is a plane at all.

  THE METRE TOOL is not consumed by the engine and is not needed to fix the
  classic game. It is for the remaster: click two points on the ground, say how
  far apart they are, and the page can show the character standing N metres
  back. That is the "does that look right?" check, and it is the beginning of a
  metric ground plane for 2.8D.

  LAYERS, per the owner's model: (a) the plate, (b) objects the character can
  never get behind, (c) objects he can walk behind, (d) characters. (b) and (c)
  are decided in tools/pipeline/scene-index.py by asking whether the walkable
  polygon reaches further back than the object AT THE OBJECT'S OWN X -- 68 are
  (b), 49 are (c). Only (c) needs real depth in the remaster; (b) can be baked
  onto the plate.

  Dev tool. Served by `npm run dev` and deliberately NOT in the deploy
  allowlist -- it is not part of the game.
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #14100c; color: #e8dcc0; font: 13px/1.45 system-ui, sans-serif; display: flex; height: 100vh; }
  aside { width: 240px; flex: 0 0 auto; overflow-y: auto; border-right: 1px solid #3a3025; padding: 10px; }
  aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #8d7a55; margin: 12px 0 4px; }
  aside button { display: block; width: 100%; text-align: left; padding: 5px 7px; border: 0; border-radius: 3px;
                 background: transparent; color: #e8dcc0; font: inherit; cursor: pointer; }
  aside button:hover { background: #241c12; }
  aside button.on { background: #c8a040; color: #14100c; }
  aside .dot { float: right; font-size: 11px; }
  aside .no { color: #d08a5a; }
  main { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }
  #bar { padding: 8px 12px; border-bottom: 1px solid #3a3025; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  #bar label { color: #8d7a55; }
  #bar input[type=number] { width: 76px; background: #241c12; color: #e8dcc0; border: 1px solid #5a4526;
                            border-radius: 3px; padding: 3px 5px; font: inherit; }
  #bar button { background: #c8a040; color: #14100c; border: 0; border-radius: 3px; padding: 5px 10px;
                font: inherit; font-weight: 600; cursor: pointer; }
  #bar button.ghost { background: transparent; color: #c8a040; border: 1px solid #5a4526; font-weight: 400; }
  #wrap { flex: 1 1 auto; overflow: auto; padding: 14px; }
  #stage { position: relative; transform-origin: top left; }
  #stage img.bg { display: block; image-rendering: pixelated; }
  .obj { position: absolute; border: 1px solid; font-size: 10px; color: #fff; pointer-events: none;
         text-shadow: 0 0 3px #000; }
  .obj.b { border-color: #6aa9ff; background: rgba(106,169,255,.10); }
  .obj.c { border-color: #ffa04a; background: rgba(255,160,74,.10); }
  .obj span { position: absolute; top: -1px; left: 1px; }
  .scan { position: absolute; left: 0; right: 0; height: 0; border-top: 1px dashed #c8a040; cursor: ns-resize; }
  .scan b { position: absolute; left: 4px; top: -16px; font-size: 11px; color: #c8a040; background: #14100c; padding: 0 4px; }
  .scan.hz { border-top: 1px solid #6aa9ff; }
  .scan.hz b { color: #6aa9ff; left: auto; right: 4px; }
  .vp { position: absolute; width: 11px; height: 11px; margin: -6px 0 0 -6px; border: 1px solid #6aa9ff;
        background: rgba(106,169,255,.35); cursor: move; }
  .char { position: absolute; image-rendering: pixelated; transform-origin: bottom left; pointer-events: none; }
  .char.ghost { opacity: .5; filter: hue-rotate(150deg); }
  .char.free { pointer-events: auto; cursor: grab; transform-origin: 50% 100%; }
  .char.pin { pointer-events: auto; cursor: pointer; transform-origin: 50% 100%;
              opacity: .45; filter: sepia(1) saturate(2.5) hue-rotate(-25deg); }
  .tag.warm { color: #d08a5a; }
  .tag { position: absolute; font-size: 11px; color: #6aa9ff; background: #14100c; padding: 0 4px; pointer-events: none; }
  svg.grid { position: absolute; inset: 0; pointer-events: none; }
  svg.poly { position: absolute; inset: 0; pointer-events: none; }
  #out { border-top: 1px solid #3a3025; padding: 8px 12px; font-family: ui-monospace, monospace; font-size: 12px;
         color: #9fd08a; white-space: pre-wrap; word-break: break-all; }
  #hint { color: #8d7a55; padding: 0 12px 8px; font-size: 12px; }
</style>
</head>
<body>
<aside id="list"></aside>
<main>
  <div id="bar">
    <span id="title" style="font-weight:600"></span>
    <label>defaultscaling <input type="number" id="d" step="0.01" min="0.05" max="4"></label>
    <label>scanline1 <input type="number" id="a" step="1"></label>
    <label>scaling2 <input type="number" id="s" step="0.01" min="0.05" max="4"></label>
    <label>scanline2 <input type="number" id="b" step="1"></label>
    <label>zoom <input type="number" id="z" step="0.05" min="0.2" max="3" value="1"></label>
    <button id="copy">Copy GML</button>
    <button class="ghost" id="reset">Reset</button>
    <button class="ghost" id="metre">Set scale (2 clicks)</button>
    <button class="ghost" id="him">Show him</button>
    <label><input type="checkbox" id="showRef" checked> him in game</label>
    <label><input type="checkbox" id="showGrid" checked> grid</label>
    <label><input type="checkbox" id="showObjs" checked> objects</label>
    <label><input type="checkbox" id="showPoly" checked> walkable</label>
  </div>
  <div id="wrap"><div id="stage"></div></div>
  <div id="hint"></div>
  <pre id="out"></pre>
</main>
<script>
const $ = s => document.querySelector(s);
let scenes = {}, cur = null, curT = null, metrePts = [], metres = null, zoom = 1;
let him = null;      // {x, y}: feet of the draggable check figure, world px
let vpx = null;      // vanishing point x -- visual only, the engine has no lateral term
let draftYh = null;  // horizon guess while the terrain is still flat (d === s)
let pins = [];       // {x, y, k} size judgements, pinned by double-clicking him

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

fetch('/scene-index.json').then(r => r.json()).then(d => {
  scenes = d;
  buildList();
  const first = Object.values(scenes).find(s => s.terrains.some(t => t.polygon.length));
  select(first ? first.name : Object.keys(scenes)[0]);
});

function buildList() {
  const byChapter = {};
  for (const s of Object.values(scenes)) (byChapter[s.chapter] ||= []).push(s);
  const el = $('#list');
  el.innerHTML = '';
  for (const ch of Object.keys(byChapter).sort()) {
    const h = document.createElement('h2'); h.textContent = ch; el.appendChild(h);
    for (const s of byChapter[ch].sort((x, y) => x.name.localeCompare(y.name))) {
      const done = s.terrains.some(t => t.scanline1);
      const btn = document.createElement('button');
      btn.dataset.scene = s.name;
      btn.innerHTML = s.name.replace(/^s_/, '') +
        `<span class="dot ${done ? '' : 'no'}">${done ? '✓' : '—'}</span>`;
      btn.onclick = () => select(s.name);
      el.appendChild(btn);
    }
  }
}

function select(name) {
  cur = scenes[name];
  // Pick the FLOOR, not the backdrop's full-screen terrain. In order of how
  // much the content actually tells us: terrains that host MovingActors are
  // where characters stand (authoritative, but only 10 scenes declare any);
  // then anything already calibrated; then the "t_Xl" naming the content uses
  // for a floor layer; then any polygon that is not the whole screen.
  curT = cur.terrains.find(t => t.walkable)
      || cur.terrains.find(t => t.scanline1)
      || cur.terrains.find(t => /l$/.test(t.name) && t.polygon.length)
      || cur.terrains.find(t => t.polygon.length && t.polygonName !== 'p_All')
      || cur.terrains.find(t => t.polygon.length)
      || cur.terrains[0];
  metrePts = []; metres = null;
  him = null; vpx = null; draftYh = null; pins = [];
  $('#him').textContent = 'Show him';
  document.querySelectorAll('#list button').forEach(b => b.classList.toggle('on', b.dataset.scene === name));
  $('#title').textContent = name + '  ·  ' + curT.name;
  $('#d').value = curT.defaultscaling ?? 1;
  $('#a').value = curT.scanline1 ?? Math.round(cur.height * 0.95);
  $('#b').value = curT.scanline2 ?? Math.round(cur.height * 0.60);
  $('#s').value = curT.scaling2 ?? (curT.defaultscaling ?? 1) * 0.7;
  render();
}

function vals() {
  return { d: +$('#d').value, a: +$('#a').value, b: +$('#b').value, s: +$('#s').value };
}

function render() {
  if (!cur) return;
  const v = vals();
  zoom = +$('#z').value || 1;
  const st = $('#stage');
  st.style.transform = `scale(${zoom})`;
  st.style.width = cur.width + 'px';
  st.style.height = cur.height + 'px';
  st.innerHTML = '';

  const bg = document.createElement('img');
  bg.className = 'bg'; bg.src = cur.background; bg.width = cur.width; bg.height = cur.height;
  st.appendChild(bg);

  if ($('#showPoly').checked && curT.polygon.length) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'poly');
    svg.setAttribute('width', cur.width); svg.setAttribute('height', cur.height);
    const pg = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    pg.setAttribute('points', curT.polygon.map(p => p.join(',')).join(' '));
    pg.setAttribute('fill', 'rgba(120,190,30,.12)');
    pg.setAttribute('stroke', '#78be1e');
    svg.appendChild(pg); st.appendChild(svg);
  }

  if ($('#showObjs').checked) for (const o of (cur.objects || [])) {
    const d = document.createElement('div');
    d.className = 'obj ' + o.layer;
    // Actors are top-left anchored at (x, y - z), the same rule the backdrop
    // follows: it sits at (0,-1,-1) and lands at (0,0).
    d.style.left = o.x + 'px';
    d.style.top = (o.y - o.z) + 'px';
    d.style.width = (o.w || 20) + 'px';
    d.style.height = (o.h || 20) + 'px';
    d.innerHTML = `<span>${o.layer}·${o.name.replace(/^a_/, '')}</span>`;
    st.appendChild(d);
  }

  // The vanishing line and its grid. Drawn before the scanlines so their
  // handles stay on top.
  const yh = impliedHorizon() ?? (draftYh ??= Math.round(cur.height * 0.4));
  if (vpx === null) vpx = Math.round(cur.width / 2);
  if ($('#showGrid').checked && yh < cur.height - 20) {
    st.appendChild(grid(yh));
    // A weak ramp puts the implied horizon far above the frame (Extro:
    // y=-530). The grid uses the true value; the handle is clamped into the
    // frame so it can still be grabbed and dragged where it belongs.
    const yhDisp = clamp(yh, 8, cur.height - 24);
    const hz = document.createElement('div');
    hz.className = 'scan hz'; hz.style.top = yhDisp + 'px';
    hz.innerHTML = `<b>horizon ${Math.round(yh)} · 0×` +
      (impliedHorizon() === null ? ' · drag to set the ramp' : yhDisp !== yh ? ' · off-frame, drag down' : '') + '</b>';
    hz.onpointerdown = dragHorizon;
    st.appendChild(hz);
    const vp = document.createElement('div');
    vp.className = 'vp'; vp.style.left = vpx + 'px'; vp.style.top = yhDisp + 'px';
    vp.onpointerdown = dragVP;
    st.appendChild(vp);
  }

  for (const [line, scale, label] of [[v.a, v.d, 'scanline1'], [v.b, v.s, 'scanline2']]) {
    const ln = document.createElement('div');
    ln.className = 'scan'; ln.style.top = line + 'px';
    ln.innerHTML = `<b>${label} ${Math.round(line)} · ${scale.toFixed(3)}×</b>`;
    ln.onpointerdown = e => drag(e, label === 'scanline1' ? '#a' : '#b');
    st.appendChild(ln);
  }

  // The in-game reference pair, blue: how getScaling sizes him at the nearest
  // and farthest WALKABLE spots. It used to stand on the raw scanlines, but
  // 1998 authored some of those beyond the room (t_HjaVolvul: scanline2=800 in
  // a 600-high room), and a reference below the frame is no reference.
  if ($('#showRef').checked) for (const [pt, label] of refPoints()) {
    const k = Math.max(0.02, scalingAt(pt[1]));
    const g = character(pt[1], k, true);
    g.style.left = pt[0] + 'px';
    st.appendChild(g);
    const tag = document.createElement('div');
    tag.className = 'tag';
    tag.style.left = (pt[0] + 8) + 'px'; tag.style.top = (pt[1] + 4) + 'px';
    tag.textContent = `in game, ${label} · ${k.toFixed(3)}×`;
    st.appendChild(tag);
  }

  // The pinned judgements, sepia. Each keeps the size it was given -- pins are
  // samples, the fit moves the numbers, never the evidence.
  for (let i = 0; i < pins.length; i++) {
    const pn = pins[i];
    const img = document.createElement('img');
    img.className = 'char pin';
    const sprite = playerSprite();
    img.src = sprite ? chromaKey(sprite).url : '';
    img.style.left = pn.x + 'px'; img.style.top = pn.y + 'px';
    img.style.transform = `translate(-50%,-100%) scale(${pn.k})`;
    img.title = 'click to remove';
    img.onpointerdown = e => { e.stopPropagation(); pins.splice(i, 1); fitPins(); };
    st.appendChild(img);
    const tag = document.createElement('div');
    tag.className = 'tag warm';
    tag.style.left = (pn.x + 8) + 'px'; tag.style.top = (pn.y + 4) + 'px';
    tag.textContent = `pin ${pn.k.toFixed(3)}×`;
    st.appendChild(tag);
  }

  if (him) {
    const k = Math.max(0.02, scalingAt(him.y));
    const img = document.createElement('img');
    img.className = 'char free';
    const sprite = playerSprite();
    img.src = sprite ? chromaKey(sprite).url : '';
    img.style.left = him.x + 'px';
    img.style.top = him.y + 'px';
    img.style.transform = `translate(-50%,-100%) scale(${k})`;
    img.onpointerdown = dragHim;
    img.onwheel = wheelHim;
    img.ondblclick = () => {
      pins.push({ x: him.x, y: him.y, k: Math.max(0.02, scalingAt(him.y)) });
      fitPins();
    };
    st.appendChild(img);
    const tag = document.createElement('div');
    tag.className = 'tag';
    tag.style.left = (him.x + 8) + 'px'; tag.style.top = (him.y + 4) + 'px';
    tag.textContent = `y ${Math.round(him.y)} · ${k.toFixed(3)}× · scroll to size · dblclick to pin`;
    st.appendChild(tag);
  }

  // With three or more pins the art gets a say the engine cannot express: the
  // full plane k = px + qy + r, whose zero is a vanishing LINE that may tilt.
  const pf = planeFit();
  if (pf && $('#showGrid').checked && Math.abs(pf.q) > 1e-9) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'grid');
    svg.setAttribute('width', cur.width); svg.setAttribute('height', cur.height);
    const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    l.setAttribute('x1', 0); l.setAttribute('y1', -pf.r / pf.q);
    l.setAttribute('x2', cur.width); l.setAttribute('y2', -(pf.p * cur.width + pf.r) / pf.q);
    l.setAttribute('stroke', '#d08a5a'); l.setAttribute('stroke-dasharray', '6 4');
    svg.appendChild(l); st.appendChild(svg);
  }

  // "N metres back" ghost, once a scale is known. Perspective-correct when a
  // horizon exists: equal ground steps are equal steps in 1/(y-yh), the same
  // rule the grid uses. Linear fallback when the terrain is flat.
  if (metres && metres.pxPerM) {
    const ih = impliedHorizon();
    let backY;
    if (ih !== null && v.a - metres.pxPerM > ih) {
      const u = y => 1 / (y - ih);
      backY = ih + 1 / (u(v.a) + 5 * (u(v.a - metres.pxPerM) - u(v.a)));
    } else {
      backY = v.a - 5 * metres.pxPerM;
    }
    if (backY > 0) {
      const g = character(backY, scalingAt(backY), true);
      st.appendChild(g);
    }
  }

  out();
}

// The engine's scale is linear in y; a pinhole camera over a flat floor is
// linear in y too, reaching zero AT the horizon. The lerp's zero is therefore
// the vanishing line: yh = (s*a - d*b)/(s - d). Null when flat (no ramp).
function impliedHorizon() {
  const v = vals();
  if (v.d === v.s || v.a === v.b) return null;
  const yh = (v.s * v.a - v.d * v.b) / (v.s - v.d);
  return yh < Math.min(v.a, v.b) ? yh : null;   // a "horizon" below the floor is an inverted ramp, not a camera
}

// Drag the horizon: the front anchor (scanline1, defaultscaling) holds, and
// scaling2 is derived instead of guessed. scale(y) ∝ (y - yh).
function setHorizon(yh) {
  const v = vals();
  yh = Math.min(yh, Math.min(v.a, v.b) - 10);
  $('#s').value = Math.max(0.02, v.d * (v.b - yh) / (v.a - yh)).toFixed(3);
  draftYh = null;
  render();
}

function grid(yh) {
  const W = cur.width, H = cur.height;
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'grid');
  svg.setAttribute('width', W); svg.setAttribute('height', H);
  const add = (x1, y1, x2, y2, op) => {
    const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    l.setAttribute('x1', x1); l.setAttribute('y1', y1);
    l.setAttribute('x2', x2); l.setAttribute('y2', y2);
    l.setAttribute('stroke', `rgba(106,169,255,${op})`);
    svg.appendChild(l);
  };
  // Cell size at the bottom edge: 1 metre when the metre tool has run.
  const S = Math.min(metres?.pxPerM || Math.round(W / 10), (H - yh) / 2);
  for (let i = -Math.ceil(W / S); i <= Math.ceil(W / S); i++)
    add(vpx + i * S, H, vpx, yh, .4);                     // rails, converging on the VP
  const u0 = 1 / (H - yh), du = 1 / (H - S - yh) - u0;    // equal ground steps: 1/(y-yh) is arithmetic
  for (let n = 0, y = H; n < 80 && y > yh + 3; n++) {
    y = yh + 1 / (u0 + n * du);
    add(0, y, W, y, n ? .3 : .5);
  }
  return svg;
}

// Where the reference pair stands: the walkable polygon's nearest and farthest
// vertices, clamped into frame. Falls back to the scanlines (clamped) when the
// terrain has no polygon.
function refPoints() {
  const cl = p => [clamp(p[0], 50, cur.width - 50), clamp(p[1], 20, cur.height)];
  if (curT.polygon.length >= 3) {
    // Stand INSIDE the polygon -- he cannot leave it in the game, so a
    // reference outside it lies. Centroid x was not enough: at the extreme y
    // the centroid's column can be outside entirely (s_Extro's bottom corner,
    // s_Logberg's far ghost on the hillside). Intersect a horizontal line just
    // inside the extreme y with the polygon and stand mid-span, which is
    // inside by construction.
    const ys = curT.polygon.map(p => p[1]);
    // Walk inward from the extreme until the line cuts a real span. The +0.5
    // dodges vertices sitting exactly on the sample line, whose crossing
    // parity otherwise double-counts (t_HjaVolvul put the near figure outside).
    // Clip each span to the visible frame BEFORE the midpoint: p_HjaVolvu runs
    // to x=1201 in an 800-wide room, so the polygon's own middle can be
    // off-canvas, and clamping after the fact pushed him back outside it.
    const pick = (from, dir) => {
      for (let off = 6; off <= 60; off += 4) {
        const y0 = from + dir * off + 0.5;
        const span = widestSpanAt(y0);
        if (!span) continue;
        const lo = Math.max(span[0], 50), hi = Math.min(span[1], cur.width - 50);
        if (hi - lo > 24) return [(lo + hi) / 2, y0];
      }
      return null;
    };
    const near = pick(Math.max(...ys), -1), far = pick(Math.min(...ys), +1);
    if (near && far) return [[cl(near), 'near'], [cl(far), 'far']];
  }
  const v = vals();
  return [[cl([cur.width * 0.35, v.a]), 'near'], [cl([cur.width * 0.65, v.b]), 'far']];
}

// The widest interior interval of the walkable polygon on the horizontal line
// y = y0, by edge crossing parity. Null when the line misses the polygon.
function widestSpanAt(y0) {
  const P = curT.polygon, xs = [];
  for (let i = 0; i < P.length; i++) {
    const [x1, y1] = P[i], [x2, y2] = P[(i + 1) % P.length];
    if ((y1 <= y0) !== (y2 <= y0)) xs.push(x1 + (y0 - y1) * (x2 - x1) / (y2 - y1));
  }
  xs.sort((a, b) => a - b);
  let best = null;
  for (let i = 0; i + 1 < xs.length; i += 2)
    if (!best || xs[i + 1] - xs[i] > best[1] - best[0]) best = [xs[i], xs[i + 1]];
  return best;
}

// The player sprite is the same figure in every chapter; a scene that never
// shows him (s_Extro, s_Intro) has none in the index, so borrow one -- the
// button must not silently do nothing.
function playerSprite() {
  if (cur.player) return cur.player;
  for (const s of Object.values(scenes)) if (s.player) return s.player;
  return null;
}

function scalingAt(y) {
  const v = vals();
  if (v.a === v.b) return v.d;
  const aCoef = (v.d - v.s) / (v.a - v.b);
  const bCoef = v.s - aCoef * v.b;
  return aCoef * y + bCoef;
}

// The sprites are chroma-keyed green plates; the game keys them at load. Do the
// same here or the character shows as a green slab and you cannot judge his size
// against the art at all.
const keyed = new Map();
function chromaKey(src) {
  if (keyed.has(src)) return keyed.get(src);
  const out = { url: src };
  keyed.set(src, out);
  const im = new Image();
  im.onload = () => {
    const c = document.createElement('canvas');
    c.width = im.naturalWidth; c.height = im.naturalHeight;
    const g = c.getContext('2d');
    g.drawImage(im, 0, 0);
    const d = g.getImageData(0, 0, c.width, c.height);
    const px = d.data;
    for (let i = 0; i < px.length; i += 4) {
      // Generous on purpose: this is a preview, and the 1998 plates carry
      // palette drift around the key (known-issues #4).
      if (px[i + 1] > 150 && px[i] < 130 && px[i + 2] < 130) px[i + 3] = 0;
    }
    g.putImageData(d, 0, 0);
    out.url = c.toDataURL();
    render();
  };
  im.src = src;
  return out;
}

function character(y, scale, ghost) {
  const img = document.createElement('img');
  img.className = 'char' + (ghost ? ' ghost' : '');
  const sprite = playerSprite();
  img.src = sprite ? chromaKey(sprite).url : '';
  img.style.left = (cur.width * 0.5) + 'px';
  img.style.top = y + 'px';
  img.style.transform = `translateY(-100%) scale(${scale})`;
  return img;
}

function drag(e, sel) {
  e.preventDefault();
  const st = $('#stage').getBoundingClientRect();
  const move = ev => {
    $(sel).value = Math.round(clamp((ev.clientY - st.top) / zoom, 0, cur.height));
    render();
  };
  const up = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); };
  addEventListener('pointermove', move); addEventListener('pointerup', up);
}

function dragHorizon(e) {
  e.preventDefault();
  const st = $('#stage').getBoundingClientRect();
  const move = ev => setHorizon((ev.clientY - st.top) / zoom);
  const up = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); };
  addEventListener('pointermove', move); addEventListener('pointerup', up);
}

function dragVP(e) {
  e.preventDefault(); e.stopPropagation();
  const st = $('#stage').getBoundingClientRect();
  const move = ev => {
    vpx = Math.round(clamp((ev.clientX - st.left) / zoom, -cur.width, cur.width * 2));
    setHorizon((ev.clientY - st.top) / zoom);
  };
  const up = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); };
  addEventListener('pointermove', move); addEventListener('pointerup', up);
}

// Resize him in place: the judgement "he is THIS big HERE" -- made against
// whatever reference the art offers, walkable or not -- is written back into
// the ramp. On scanline1 it sets defaultscaling itself; anywhere else the
// line through the front anchor and this (y, scale) point is evaluated at
// scanline2. The in-game reference pair re-renders as the consequence.
function wheelHim(e) {
  e.preventDefault();
  const v = vals();
  const k = Math.max(0.02, scalingAt(him.y) * (e.deltaY < 0 ? 1.02 : 1 / 1.02));
  if (Math.abs(him.y - v.a) < 15) {
    $('#d').value = k.toFixed(3);
  } else {
    $('#s').value = Math.max(0.02, v.d + (k - v.d) * (v.b - v.a) / (him.y - v.a)).toFixed(3);
  }
  render();
}

// Two pins make the plane exactly; more make it least-squares in y. The
// engine's anchor lines stay put -- the fitted line is written as new values
// AT scanline1 and scanline2, which is the same line in the engine's terms.
function fitPins() {
  if (pins.length >= 2) {
    const n = pins.length;
    let sy = 0, sk = 0, syy = 0, syk = 0;
    for (const { y, k } of pins) { sy += y; sk += k; syy += y * y; syk += y * k; }
    const den = n * syy - sy * sy;
    if (Math.abs(den) > 1e-6) {
      const al = (n * syk - sy * sk) / den, be = (sk - al * sy) / n;
      const v = vals();
      $('#d').value = Math.max(0.02, al * v.a + be).toFixed(3);
      $('#s').value = Math.max(0.02, al * v.b + be).toFixed(3);
    }
  }
  render();
}

// Least-squares plane k = px + qy + r over all pins -- the "size for each
// position" the owner described. The engine consumes none of the x term; the
// tilt and residual are for the remaster, and for judging whether the art's
// floor is really a plane at all.
function planeFit() {
  if (pins.length < 3) return null;
  let Sxx = 0, Sxy = 0, Sx = 0, Syy = 0, Sy = 0, Sxk = 0, Syk = 0, Sk = 0;
  for (const { x, y, k } of pins) {
    Sxx += x * x; Sxy += x * y; Sx += x; Syy += y * y; Sy += y;
    Sxk += x * k; Syk += y * k; Sk += k;
  }
  const A = [[Sxx, Sxy, Sx], [Sxy, Syy, Sy], [Sx, Sy, pins.length]];
  const det = m => m[0][0] * (m[1][1] * m[2][2] - m[1][2] * m[2][1])
               - m[0][1] * (m[1][0] * m[2][2] - m[1][2] * m[2][0])
               + m[0][2] * (m[1][0] * m[2][1] - m[1][1] * m[2][0]);
  const D = det(A);
  if (Math.abs(D) < 1e-3) return null;   // collinear pins: no plane yet
  const B = [Sxk, Syk, Sk];
  const [p, q, r] = [0, 1, 2].map(c =>
    det(A.map((row, i) => row.map((cell, j) => j === c ? B[i] : cell))) / D);
  const res = Math.sqrt(pins.reduce((a, pn) => a + (p * pn.x + q * pn.y + r - pn.k) ** 2, 0) / pins.length);
  return { p, q, r, res };
}

function dragHim(e) {
  e.preventDefault();
  const st = $('#stage').getBoundingClientRect();
  const move = ev => {
    him.x = clamp((ev.clientX - st.left) / zoom, 0, cur.width);
    him.y = clamp((ev.clientY - st.top) / zoom, 1, cur.height);
    render();
  };
  const up = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); };
  addEventListener('pointermove', move); addEventListener('pointerup', up);
}

function out() {
  const v = vals();
  const ramp = v.a === v.b ? 1 : Math.abs(v.d / v.s);
  $('#out').textContent =
    `<SimplePseudo3DTerrain name="${curT.name}" scene="${cur.name}" polygon="${curT.polygonName}"\n` +
    `\tzmin="${curT.zmin}" zmax="${curT.zmax}" defaultscaling="${v.d}"\n` +
    `\tscanline1="${v.a}" scanline2="${v.b}" scaling2="${v.s}"/>` +
    `\n\n; front/back size ratio ${ramp.toFixed(3)}×` +
    (metres ? `   ·   ${metres.pxPerM.toFixed(1)} px per metre at the front` : '') +
    `\n; implied horizon ${(() => { const h = impliedHorizon();
      return h === null ? 'NONE — flat, characters do not shrink with depth'
           : `y=${Math.round(h)}${h < 0 ? ' (above the frame — ramp weaker than the art’s perspective?)' : ''}`; })()}` +
    (pins.length ? `\n; pins: ${pins.length}${pins.length >= 2 ? ' — the four numbers are the fit through them' : ''}` +
      (() => { const pf = planeFit();
        return pf ? `\n; full plane from pins: lateral tilt ${(pf.p * 100).toFixed(3)}× per 100px` +
          ` · fit ±${pf.res.toFixed(3)} — the engine has no lateral term; this is for the remaster` : ''; })() +
      // The samples themselves ride along with Copy GML: they are the
      // measurement, the fit is derived. 20 points up a riverbank are the
      // ground truth a spline or the remaster's terrain mesh gets fitted
      // through later; the classic engine only drinks the linear fit.
      pins.map(pn => `\n; pin x=${Math.round(pn.x)} y=${Math.round(pn.y)} scale=${pn.k.toFixed(3)}`).join('')
      : '') +
    (curT.scanline1 ? `\n; was: scanline1="${curT.scanline1}" scanline2="${curT.scanline2}" scaling2="${curT.scaling2}"`
                    : `\n; was: UNCALIBRATED (constant ${curT.defaultscaling}×)`);
}

$('#wrap').addEventListener('click', e => {
  if (!metrePts.pending) return;
  const st = $('#stage').getBoundingClientRect();
  metrePts.push([(e.clientX - st.left) / zoom, (e.clientY - st.top) / zoom]);
  if (metrePts.length === 2) {
    const m = parseFloat(prompt('How many metres between those two points?', '5'));
    if (m > 0) {
      const dy = Math.abs(metrePts[1][1] - metrePts[0][1]) || 1;
      metres = { pxPerM: dy / m };
    }
    metrePts = []; metrePts.pending = false;
    $('#hint').textContent = metres ? `Scale set: ${metres.pxPerM.toFixed(1)} px per metre. The faded figure is 5 m behind scanline1.` : '';
    render();
  }
});
$('#metre').onclick = () => {
  metrePts = []; metrePts.pending = true;
  $('#hint').textContent = 'Click two points on the ground, then give the distance in metres.';
};
$('#him').onclick = () => {
  if (!cur || !playerSprite()) return;
  // Start him between the two references -- mid-floor, not on scanline1,
  // which can sit below the room.
  const [[nearPt], [farPt]] = refPoints();
  him = him ? null : { x: (nearPt[0] + farPt[0]) / 2, y: (nearPt[1] + farPt[1]) / 2 };
  $('#him').textContent = him ? 'Hide him' : 'Show him';
  $('#hint').textContent = him
    ? 'Drag him anywhere — next to any reference in the art, walkable or not. Scroll to resize, double-click to pin the judgement. Two pins make the plane; more make a fit, and expose the lateral tilt the engine cannot express. Click a pin to remove it.'
    : '';
  render();
};

for (const id of ['#d', '#a', '#b', '#s', '#z']) $(id).oninput = render;
for (const id of ['#showRef', '#showGrid', '#showObjs', '#showPoly']) $(id).onchange = render;
$('#reset').onclick = () => select(cur.name);
$('#copy').onclick = () => navigator.clipboard.writeText(
  $('#out').textContent.split('\n\n')[0] +
  // The samples travel with the element, as legal XML: they are the
  // measurement, the four numbers only the linear fit through them.
  (pins.length ? `\n<!-- calibration pins (x,y,scale): ${
    pins.map(pn => `${Math.round(pn.x)},${Math.round(pn.y)},${pn.k.toFixed(3)}`).join(' ')} -->` : ''));
</script>
</body>
</html>
