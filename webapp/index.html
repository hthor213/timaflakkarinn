<!DOCTYPE html>
<html lang="is">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tímaflakkarinn</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    /* Debug deployment (tt-dev.*) reserves room for the 280px side panel and
       180px log strip. Play deployment gets the whole viewport. main.ts stamps
       data-mode on <html>. */
    html[data-mode="debug"] body {
      width: calc(100vw - 280px);
      height: calc(100vh - 180px);
    }
    #game-container {
      position: relative;
      width: 800px;
      height: 600px;
    }
    /* Play: scale to fit the viewport, preserving the 4:3 frame. The canvas
       backing store stays 800x600, so every game coordinate is unchanged, and
       World.handleMouseMove already maps pointer position through
       getBoundingClientRect() — so scaling is safe for input. */
    html[data-mode="play"] #game-container {
      width: min(100vw, calc(100vh * 4 / 3));
      height: min(100vh, calc(100vw * 3 / 4));
    }
    html[data-mode="play"] #game-canvas {
      width: 100%;
      height: 100%;
    }
    #game-canvas {
      display: block;
      image-rendering: pixelated;
      cursor: none;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ccc;
      font-family: serif;
      font-size: 24px;
      text-align: center;
    }
    #loading .bar {
      width: 300px;
      height: 8px;
      background: #333;
      margin: 16px auto;
      border-radius: 4px;
    }
    #loading .bar-fill {
      height: 100%;
      background: #c8a040;
      border-radius: 4px;
      width: 0%;
      transition: width 0.3s;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas" width="800" height="600"></canvas>
    <div id="loading">
      <div>Tímaflakkarinn</div>
      <div class="bar"><div class="bar-fill" id="loading-bar"></div></div>
      <div id="loading-text" style="font-size: 14px; margin-top: 8px;">Hleð inn...</div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
